version: '3.9'
services:
  knowme-backend:
    build: .
    container_name: knowme-backend
    env_file:
      - .env.production.example
    depends_on:
      - postgres
      - redis
    ports:
      - "5000:5000"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: knowme
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
